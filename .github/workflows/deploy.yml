name: Build & Deploy

on:
  push:
    branches: [main, claude/*]
  pull_request:
    branches: [main]

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ============ BUILD ============
      - name: Install dependencies
        id: install
        run: npm ci 2>&1 | tee install.log

      - name: Type check
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit 2>&1 | tee typecheck.log || true

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint 2>&1 | tee lint.log || true

      - name: Build
        id: build
        run: npm run build 2>&1 | tee build.log

      # ============ DEPLOY ============
      - name: Install Railway CLI
        if: github.event_name == 'push'
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        id: deploy
        if: github.event_name == 'push'
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "ERROR: RAILWAY_TOKEN not set!"
            exit 1
          fi
          railway up 2>&1 | tee deploy.log

      - name: Wait for deployment
        if: github.event_name == 'push' && steps.deploy.outcome == 'success'
        run: sleep 45

      - name: Get Runtime Logs
        id: runtime
        if: github.event_name == 'push'
        continue-on-error: true
        run: railway logs --limit 100 2>&1 | tee runtime.log || echo "Could not fetch logs" > runtime.log

      - name: Health Check
        id: health
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          DEPLOY_URL="landgenerator-production.up.railway.app"
          HTTP_STATUS=$(curl -s -o health.json -w "%{http_code}" "https://$DEPLOY_URL/api/health" || echo "000")
          echo "HTTP_STATUS=$HTTP_STATUS" >> $GITHUB_OUTPUT
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Health check passed"
          else
            echo "❌ Health check failed: $HTTP_STATUS"
            cat health.json 2>/dev/null || true
          fi

      # ============ SAVE LOGS TO REPO ON FAILURE ============
      - name: Save error logs to repo
        if: failure()
        run: |
          mkdir -p .github/logs

          echo "# 🚨 Build/Deploy Error Log" > .github/logs/latest-error.md
          echo "" >> .github/logs/latest-error.md
          echo "**Commit:** \`${{ github.sha }}\`" >> .github/logs/latest-error.md
          echo "**Branch:** \`${{ github.ref_name }}\`" >> .github/logs/latest-error.md
          echo "**Time:** $(date -u)" >> .github/logs/latest-error.md
          echo "**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> .github/logs/latest-error.md
          echo "" >> .github/logs/latest-error.md

          echo "## Step Results" >> .github/logs/latest-error.md
          echo "| Step | Status |" >> .github/logs/latest-error.md
          echo "|------|--------|" >> .github/logs/latest-error.md
          echo "| Install | ${{ steps.install.outcome }} |" >> .github/logs/latest-error.md
          echo "| TypeScript | ${{ steps.typecheck.outcome }} |" >> .github/logs/latest-error.md
          echo "| Lint | ${{ steps.lint.outcome }} |" >> .github/logs/latest-error.md
          echo "| Build | ${{ steps.build.outcome }} |" >> .github/logs/latest-error.md
          echo "| Deploy | ${{ steps.deploy.outcome || 'skipped' }} |" >> .github/logs/latest-error.md
          echo "| Health | ${{ steps.health.outcome || 'skipped' }} |" >> .github/logs/latest-error.md
          echo "" >> .github/logs/latest-error.md

          if [ -f install.log ]; then
            echo "## Install Log" >> .github/logs/latest-error.md
            echo '```' >> .github/logs/latest-error.md
            tail -50 install.log >> .github/logs/latest-error.md
            echo '```' >> .github/logs/latest-error.md
            echo "" >> .github/logs/latest-error.md
          fi

          if [ -f typecheck.log ]; then
            echo "## TypeScript Errors" >> .github/logs/latest-error.md
            echo '```' >> .github/logs/latest-error.md
            cat typecheck.log >> .github/logs/latest-error.md
            echo '```' >> .github/logs/latest-error.md
            echo "" >> .github/logs/latest-error.md
          fi

          if [ -f lint.log ]; then
            echo "## Lint Output" >> .github/logs/latest-error.md
            echo '```' >> .github/logs/latest-error.md
            cat lint.log >> .github/logs/latest-error.md
            echo '```' >> .github/logs/latest-error.md
            echo "" >> .github/logs/latest-error.md
          fi

          if [ -f build.log ]; then
            echo "## Build Log" >> .github/logs/latest-error.md
            echo '```' >> .github/logs/latest-error.md
            tail -100 build.log >> .github/logs/latest-error.md
            echo '```' >> .github/logs/latest-error.md
            echo "" >> .github/logs/latest-error.md
          fi

          if [ -f deploy.log ]; then
            echo "## Deploy Log" >> .github/logs/latest-error.md
            echo '```' >> .github/logs/latest-error.md
            cat deploy.log >> .github/logs/latest-error.md
            echo '```' >> .github/logs/latest-error.md
            echo "" >> .github/logs/latest-error.md
          fi

          if [ -f runtime.log ]; then
            echo "## Runtime Log" >> .github/logs/latest-error.md
            echo '```' >> .github/logs/latest-error.md
            cat runtime.log >> .github/logs/latest-error.md
            echo '```' >> .github/logs/latest-error.md
          fi

      - name: Commit error logs
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/logs/latest-error.md
          git commit -m "ci: Save error logs from failed build

          Run: ${{ github.run_id }}
          Commit: ${{ github.sha }}"
          git push

      # ============ SUMMARY ============
      - name: Summary
        if: always()
        run: |
          echo "## Build & Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Install | ${{ steps.install.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript | ${{ steps.typecheck.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ steps.lint.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ steps.build.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ steps.deploy.outcome || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Health | ${{ steps.health.outcome || 'skipped' }} (${{ steps.health.outputs.HTTP_STATUS || 'N/A' }}) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://landgenerator-production.up.railway.app" >> $GITHUB_STEP_SUMMARY

      # ============ CLEANUP ON SUCCESS ============
      - name: Remove error log on success
        if: success() && github.event_name == 'push'
        run: |
          if [ -f .github/logs/latest-error.md ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm .github/logs/latest-error.md
            git commit -m "ci: Remove error log after successful deploy"
            git push
          fi
