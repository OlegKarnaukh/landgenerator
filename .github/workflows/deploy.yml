name: Build & Deploy

on:
  push:
    branches: [main, claude/*]
  pull_request:
    branches: [main]

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ============ BUILD ============
      - name: Install dependencies
        run: npm ci

      - name: Type check
        id: typecheck
        continue-on-error: true
        run: |
          echo "## TypeScript Check" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npx tsc --noEmit 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          echo "## Lint" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npm run lint 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Build
        id: build
        run: |
          echo "## Build Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npm run build 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # ============ DEPLOY ============
      - name: Install Railway CLI
        if: github.event_name == 'push'
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        id: deploy
        if: github.event_name == 'push'
        run: |
          echo "## Railway Deploy" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "ERROR: RAILWAY_TOKEN not set!" | tee -a $GITHUB_STEP_SUMMARY
            exit 1
          fi

          railway up 2>&1 | tee -a $GITHUB_STEP_SUMMARY

          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Wait for deployment
        if: github.event_name == 'push'
        run: |
          echo "Waiting 45 seconds for deployment to start..."
          sleep 45

      - name: Get Runtime Logs
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          echo "## Railway Runtime Logs (last 50 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          railway logs --limit 50 2>&1 | tee -a $GITHUB_STEP_SUMMARY || echo "Could not fetch logs"
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Health Check
        id: health
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          echo "## Health Check" >> $GITHUB_STEP_SUMMARY

          # Get the deployment URL
          DEPLOY_URL="landgenerator-production.up.railway.app"

          echo "Checking https://$DEPLOY_URL/api/health" >> $GITHUB_STEP_SUMMARY

          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" "https://$DEPLOY_URL/api/health" || echo "000")

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "HTTP Status: $HTTP_STATUS" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat response.json 2>/dev/null | jq . >> $GITHUB_STEP_SUMMARY || echo "{}"
          echo '```' >> $GITHUB_STEP_SUMMARY

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Health check passed!**" >> $GITHUB_STEP_SUMMARY
            echo "health_ok=true" >> $GITHUB_OUTPUT
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Health check failed!**" >> $GITHUB_STEP_SUMMARY
            echo "health_ok=false" >> $GITHUB_OUTPUT
          fi

      # ============ SUMMARY ============
      - name: Final Summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "## Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript | ${{ steps.typecheck.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ steps.lint.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ steps.build.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ steps.deploy.outcome || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Health | ${{ steps.health.outcome || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://landgenerator-production.up.railway.app" >> $GITHUB_STEP_SUMMARY

      # ============ NOTIFY ON FAILURE ============
      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Deploy Failed: ${context.sha.substring(0, 7)}`;
            const body = `
## Deployment Failed

**Commit:** \`${context.sha}\`
**Branch:** \`${context.ref.replace('refs/heads/', '')}\`
**Author:** @${context.actor}

### 📋 View Full Logs
**[Click here to see all logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})**

The workflow summary contains:
- TypeScript errors
- Lint warnings
- Build output
- Railway deploy logs
- Runtime logs
- Health check result

---
*🤖 Automated by GitHub Actions*
            `;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deploy-failure'
            });

            if (issues.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['deploy-failure', 'automated']
              });
            }

      - name: Close Issue on Success
        if: success() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deploy-failure'
            });

            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Fixed in [${context.sha.substring(0, 7)}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
