name: Health Check & Logs

on:
  # Run every 6 hours
  schedule:
    - cron: '0 */6 * * *'
  # Manual trigger
  workflow_dispatch:
    inputs:
      log_lines:
        description: 'Number of log lines to fetch'
        required: false
        default: '200'

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Check Application Health
        id: health
        continue-on-error: true
        run: |
          # Get the deployment URL from Railway
          DEPLOY_URL=$(railway variables get RAILWAY_PUBLIC_DOMAIN 2>/dev/null || echo "")

          if [ -n "$DEPLOY_URL" ]; then
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$DEPLOY_URL/api/health" || echo "000")
            echo "status=$HTTP_STATUS" >> $GITHUB_OUTPUT
            echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT

            if [ "$HTTP_STATUS" != "200" ]; then
              echo "Health check failed with status: $HTTP_STATUS"
              exit 1
            fi
          else
            echo "No deployment URL found"
            echo "status=no-url" >> $GITHUB_OUTPUT
          fi

      - name: Fetch Railway Logs
        id: logs
        run: |
          LOG_LINES=${{ github.event.inputs.log_lines || '200' }}

          echo "## Railway Application Logs (Last $LOG_LINES lines)" >> logs.md
          echo "" >> logs.md
          echo '```' >> logs.md
          railway logs --limit $LOG_LINES >> logs.md 2>&1 || echo "Could not fetch logs" >> logs.md
          echo '```' >> logs.md

          # Check for errors in logs
          if grep -iE "(error|exception|fatal|crash|failed)" logs.md > /dev/null 2>&1; then
            echo "has_errors=true" >> $GITHUB_OUTPUT
          else
            echo "has_errors=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Logs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: railway-logs-${{ github.run_number }}
          path: logs.md
          retention-days: 7

      - name: Create Issue if Errors Found
        if: steps.logs.outputs.has_errors == 'true' || steps.health.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const logs = fs.readFileSync('logs.md', 'utf8');

            // Extract only error lines
            const errorLines = logs.split('\n')
              .filter(line => /error|exception|fatal|crash|failed/i.test(line))
              .slice(0, 20)
              .join('\n');

            const title = `Runtime Errors Detected - ${new Date().toISOString().split('T')[0]}`;
            const body = `
            ## Application Health Check Failed

            **Time:** ${new Date().toISOString()}
            **Health Status:** ${{ steps.health.outputs.status }}
            **URL:** ${{ steps.health.outputs.url || 'N/A' }}

            ### Error Summary:
            \`\`\`
            ${errorLines || 'See full logs in artifacts'}
            \`\`\`

            ### Full Logs:
            Download from [Workflow Artifacts](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})

            ### Recommended Actions:
            1. Review the error logs above
            2. Check Railway dashboard for more details
            3. Fix the issues and deploy

            ---
            *Automated health check by GitHub Actions*
            `;

            // Check for existing open issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'runtime-error'
            });

            if (issues.data.length > 0) {
              // Comment on existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `### Update: ${new Date().toISOString()}\n\nErrors still occurring.\n\n\`\`\`\n${errorLines}\n\`\`\``
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['runtime-error', 'automated', 'high-priority']
              });
            }

      - name: Summary
        run: |
          echo "## Health Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Health Endpoint | ${{ steps.health.outputs.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Errors in Logs | ${{ steps.logs.outputs.has_errors }} |" >> $GITHUB_STEP_SUMMARY
